name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate public package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate structure
        run: npm run check

      - name: Run tests
        run: npm test
        env:
          # O CLI recusa rodar fora do caminho canonico de desenvolvimento. O
          # escape hatch oficial declara a raiz do checkout verificado; sem isto
          # os testes de install/remember falham com "Este comando deve executar
          # pelo pacote canonico" (15 testes, medido 2026-11-05).
          DEX_MEMORIA_SOURCE_CHECKOUT_ROOT: ${{ github.workspace }}

      - name: Run doctor
        run: npm run doctor

      - name: Check package contents
        run: npm run pack:check
